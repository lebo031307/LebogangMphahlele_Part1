name: Java Unit Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Get the code
      uses: actions/checkout@v4

    - name: Set up Java 8
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 8

    - name: Compile the code and the tests
      run: |
        mkdir -p out
        javac -cp "lib/" -d out src/lebogangmphahlele_part1/.java test/lebogangmphahlele_part1/*.java

    - name: Run the unit tests
      run: |
        java -cp "out:lib/*" org.junit.runner.JUnitCore \
          lebogangmphahlele_part1.LoginTest \
          lebogangmphahlele_part1.MessageTest
